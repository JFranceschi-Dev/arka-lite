name: CI-AB-Arkalitos

# define las acciones que ejecutan el pipeline
on:
  push:
  pull_request:

jobs:
  construir-probar-publicar:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}

    strategy:
      matrix:
          servicio: [ servicio-solicitudes, servicio-notificaciones ]

    steps:
      - name: Traer el codigo
        uses: actions/checkout@4

      - name: Preparar java 26
        uses: actions/setup-java@4
        with: {distribution: temurin, java-version: '26', cache: maven}

      - name: Compilar y Probar cada servicio
        run: mvn -B verify
        working-directory: ${{ matrix.servicio }}

      - name: login al registro
        uses: docker/login-action@3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        working-directory: ${{ matrix.servicio }}
        run: |
          IMG=ghcr.io/${{ github.repository }}/${{ matrix.servicio }}:${{ github.sha }}
          docker build -t "IMG" .
          docker push "$IMG"
