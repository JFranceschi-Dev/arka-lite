 name: CI-ARKA

on:
  push:
  pull_request:

jobs:
  construir-probar-probar:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    strategy:
      matrix:
        servicio: [ servicio-solicitudes, servicio-notificaciones ]
    steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-java@v4
         with: { distribution: temurin, java-version: '25', cache: maven }

       - name: probar ${{ matrix.servicio }}
         run: mvn -B verify
         working-directory: ${{ matrix.servicio }}

       - name: login al registro
         uses: docker/login-action@v3
         with:
           registry: ghcr.io
           username: ${{ github.actor }}
           password: ${{ secrets.GITHUB_TOKEN }}
       - name: construir y publicar ${{ matrix.servicio }}
         working-directory: ${{ matrix.servicio }}
         run: |
           IMG=ghcr.io/${{ github.repository }}/${{ matrix.servicio }}:${{ github.sha }}
           docker build -t "$IMG" .
           docker push "$IMG"
