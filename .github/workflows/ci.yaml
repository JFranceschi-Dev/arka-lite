name: CI-ARKA

on:
  push:
    branches: [ main ]
  pull_request:
    
jobs:
  construir-probar-publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servicio: [servicio-notificaciones, servicio-solicitudes]

    steps:
      - name: traer codigo
        uses: actions/checkout@v4

      - name: preparar java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: compilar y probar ${{ matrix.servicio }}
        run: mvn -B verify
        working-directory: ${{ matrix.servicio }}

      - name: login al registro
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: construir y publicar ${{ matrix.servicio }}
        working-directory: ${{ matrix.servicio }}
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMG=ghcr.io/$REPO_LC/${{ matrix.servicio }}:${{ github.sha }}
          docker build -t "$IMG" .
          docker push "$IMG"