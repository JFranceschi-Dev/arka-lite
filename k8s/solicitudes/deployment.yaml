apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicio-solicitudes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: servicio-solicitudes
  template:
    metadata:
      labels:
        app: servicio-solicitudes
    spec:
      containers:
        - name: servicio-solicitudes-1
          image: arka-lite-servicio-solicitudes:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: NOTIFICACIONES_URL
              value: "http://servicio-notificaciones:8080/eventos/solicitud-enviada"

          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10